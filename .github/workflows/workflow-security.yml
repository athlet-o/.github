name: Workflow supply-chain policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/validate_workflow_security.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/validate_workflow_security.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert checkout matches event revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate immutable action references
        run: python3 scripts/validate_workflow_security.py
      - name: Verify policy did not mutate tracked state
        run: git diff --exit-code
