name: ORES static trace markers
on: { pull_request: {}, workflow_call: {} }
permissions: { contents: read }
jobs:
  static-ids:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - name: Enforce static ORES IDs
        shell: bash
        run: |
          node <<'NODE'
          const cp=require('node:child_process'),fs=require('node:fs');const F=cp.execFileSync('git',['ls-files','-z']).toString().split('\0').filter(Boolean).filter(p=>/\.(?:[cm]?[jt]s|tsx|jsx|rs|dart|go|java|kt|kts)$/.test(p)&&!/(?:^|\/)(?:generated|target|vendor|node_modules|build|dist)(?:\/|$)/.test(p));const T=/^ores-trace-[A-Za-z0-9_-]{21}$/,R=/^ores-routine-[A-Za-z0-9_-]{21}$/,E=[];for(const p of F){fs.readFileSync(p,'utf8').split(/\r?\n/).forEach((l,i)=>{if(/dd-trace-[A-Za-z0-9_-]+/.test(l))E.push(`${p}:${i+1}: legacy dd-trace`);for(const m of l.matchAll(/\b(?:addTraceId|addTrace|add_trace_id|add_trace)\s*\(\s*["']([^"']+)["']/g))if(!T.test(m[1]))E.push(`${p}:${i+1}: invalid static trace ID`);if(/\b(?:const|let|var|static)\b[^=\n]*=\s*["']ores-trace-/.test(l))E.push(`${p}:${i+1}: hoisted static trace ID`);for(const m of l.matchAll(/["'](ores-routine-[A-Za-z0-9_-]+)["']/g))if(!R.test(m[1]))E.push(`${p}:${i+1}: invalid routine ID`);});}if(E.length){console.error(E.join('\n'));process.exit(1)}console.log(`validated ${F.length} files`)
          NODE
